title = "idena-web gitleaks config"

[[allowlists]]
description = "Generated image helper string table"
condition = "AND"
paths = [
  '''screens/flips/ImageAccess\.js''',
]
regexes = [
  '''var _0x3473 = \['Z2V0TWVhbg==', 'Z2V0UGl4ZWw='''',
]

[[allowlists]]
description = "Deterministic crypto test vector keys"
condition = "AND"
paths = [
  '''shared/utils/crypto\.test\.js''',
]
regexes = [
  '''const key = '[0-9a-f]{64}'$''',
]
